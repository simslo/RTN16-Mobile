name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone "$GITHUB_REPOSITORY" . -- --depth=1
          git fetch origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"

      - name: Patch app features
        run: python3 tools/patch_build.py

      - name: Build debug APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug

      - name: Upload APK ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTN16-Mobile-v0.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2-build-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#RTN16-Mobile-v0.2-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "RT-N16 Mobile V0.2" \
            --notes "Adds connected wired LAN clients alongside ASUS-MOBILE Wi-Fi clients. Router settings opens FreshTomato GUI."

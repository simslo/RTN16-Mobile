plugins {
    id 'com.android.application'
}

android {
    namespace 'si.rtn16mobile'
    compileSdk 35

    defaultConfig {
        applicationId "si.rtn16mobile"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
